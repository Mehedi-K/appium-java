name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Appium/TestNG suite on an Android emulator
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js (for the Appium server)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Download the app under test
        run: apps/download-app.sh

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # ARM system images are slower to boot on macOS runners than
          # x86_64 images are on Linux/KVM runners; API 30 boots
          # noticeably more reliably than API 33 within the default
          # timeout, and the app under test doesn't rely on anything
          # API-level-specific. emulator-boot-timeout gives extra margin
          # on top of that.
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_5
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:4723/status && break
              echo "Waiting for Appium server..."
              sleep 2
            done
            mvn -B test
        continue-on-error: true
        id: run_tests

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Appium server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
